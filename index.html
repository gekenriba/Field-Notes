<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14332a" />
  <meta name="description" content="Field Notes — offline field journal for botanical observations in Tawang District, Arunachal Pradesh." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Field Notes</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <a href="#/home" class="brand" aria-label="Field Notes home">
      <span class="brand-mark" aria-hidden="true">✿</span>
      <span>Field Notes</span>
    </a>
    <div class="topbar-right">
      <span id="netStatus" class="net-pill" title="Network status">…</span>
      <a href="#/more" class="icon-btn" aria-label="Backup and settings">⋯</a>
    </div>
  </header>

  <div id="restoreBanner" class="banner hidden">
    <span>You have an unsaved entry from earlier.</span>
    <button id="restoreYes" class="btn btn-small btn-primary" type="button">Restore</button>
    <button id="restoreNo" class="btn btn-small btn-ghost" type="button">Discard</button>
  </div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/home" data-tab="home"><span aria-hidden="true">⌂</span>Home</a>
    <a href="#/records" data-tab="records"><span aria-hidden="true">☰</span>Records<b id="draftBadge" class="badge hidden"></b></a>
    <button id="cameraFab" class="fab" type="button" aria-label="New observation with camera">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
    </button>
    <a href="#/map" data-tab="map"><span aria-hidden="true">◎</span>Map</a>
    <a href="#/species" data-tab="species"><span aria-hidden="true">❦</span>Species</a>
  </nav>

  <!-- Live camera -->
  <section id="cameraSheet" class="camera hidden" aria-label="Camera">
    <video id="cameraVideo" playsinline muted autoplay></video>
    <div class="camera-top">
      <button id="camClose" class="cam-btn" type="button" aria-label="Close camera">✕</button>
      <span id="camGps" class="cam-gps">Locating…</span>
      <button id="camTorch" class="cam-btn hidden" type="button" aria-label="Toggle flashlight">ϟ</button>
    </div>
    <div id="camStrip" class="cam-strip"></div>
    <div class="camera-bottom">
      <button id="camGallery" class="cam-btn" type="button" aria-label="Choose from gallery">▦</button>
      <button id="camShutter" class="shutter" type="button" aria-label="Take photo"></button>
      <button id="camFlip" class="cam-btn" type="button" aria-label="Switch camera">⟲</button>
    </div>
    <div class="camera-actions">
      <button id="camQuickDraft" class="btn btn-ghost-light" type="button" disabled>Quick save as draft</button>
      <button id="camDone" class="btn btn-primary" type="button" disabled>Next: details →</button>
    </div>
    <p id="camError" class="cam-error hidden"></p>
  </section>

  <input id="nativeCamInput" type="file" accept="image/*" capture="environment" class="visually-hidden" tabindex="-1" />
  <input id="galleryInput" type="file" accept="image/*" multiple class="visually-hidden" tabindex="-1" />
  <input id="importInput" type="file" accept="application/json,.json" class="visually-hidden" tabindex="-1" />

  <!-- Entry form -->
  <section id="formSheet" class="sheet hidden" aria-labelledby="formTitle">
    <form id="entryForm" novalidate>
      <div class="sheet-head">
        <button type="button" class="icon-btn" id="formClose" aria-label="Close">✕</button>
        <h2 id="formTitle">New observation</h2>
        <button type="submit" class="btn btn-small btn-primary" data-save="auto">Save</button>
      </div>

      <div class="sheet-body">
        <div id="formPhotos" class="photo-strip"></div>
        <div class="row-actions">
          <button type="button" class="btn btn-outline" id="formCamera">📷 Camera</button>
          <button type="button" class="btn btn-outline" id="formGallery">🖼 Gallery</button>
        </div>

        <fieldset class="card">
          <legend>Identification</legend>
          <div class="seg" id="groupSeg" role="radiogroup" aria-label="Organism group"></div>

          <label class="field">
            <span>Scientific name</span>
            <div class="taxon-input">
              <input id="fScientific" name="scientificName" autocomplete="off" spellcheck="false" placeholder="Start typing — e.g. Rhododendron, Meconopsis…" />
              <button type="button" id="lookupBtn" class="btn btn-small btn-outline">Look up</button>
            </div>
            <ul id="suggestList" class="suggest hidden" role="listbox"></ul>
          </label>
          <div id="lookupPanel" class="lookup hidden" aria-live="polite"></div>

          <div class="grid-2">
            <label class="field"><span>Family</span><input id="fFamily" name="family" /></label>
            <label class="field"><span>Genus</span><input id="fGenus" name="genus" /></label>
            <label class="field"><span>Common name</span><input id="fCommon" name="commonName" /></label>
            <label class="field"><span>Local name</span><input id="fLocal" name="localName" placeholder="Monpa / local" /></label>
          </div>
          <div class="grid-2">
            <label class="field"><span>ID confidence</span>
              <select id="fConfidence" name="idConfidence">
                <option value="certain">Certain</option>
                <option value="probable">Probable</option>
                <option value="tentative">Tentative (cf.)</option>
              </select>
            </label>
            <label class="field"><span>Field label</span><input id="fLabel" name="fieldLabel" placeholder="e.g. Pedicularis sp. 3 (yellow)" /></label>
          </div>
          <label class="check">
            <input type="checkbox" id="fDraft" />
            <span><strong>Keep as draft</strong> — not identified yet, I’ll update it later</span>
          </label>
        </fieldset>

        <fieldset class="card">
          <legend>Where &amp; when</legend>
          <div class="gps-row">
            <button type="button" id="gpsBtn" class="btn btn-outline">◎ Get GPS</button>
            <span id="gpsStatus" class="muted small"></span>
          </div>
          <div class="grid-2">
            <label class="field"><span>Latitude</span><input id="fLat" name="lat" type="number" step="any" inputmode="decimal" /></label>
            <label class="field"><span>Longitude</span><input id="fLng" name="lng" type="number" step="any" inputmode="decimal" /></label>
            <label class="field"><span>Altitude (m)</span><input id="fAlt" name="altitude" type="number" step="1" inputmode="numeric" /></label>
            <label class="field"><span>GPS accuracy (± m)</span><input id="fAcc" name="accuracy" type="number" step="1" inputmode="numeric" /></label>
            <label class="field"><span>Date</span><input id="fDate" name="date" type="date" /></label>
            <label class="field"><span>Time</span><input id="fTime" name="time" type="time" /></label>
          </div>
          <p id="altSource" class="muted small"></p>
          <label class="field"><span>Locality</span><input id="fLocality" name="locality" placeholder="e.g. Bumla pass, near army post" /></label>
          <label class="field"><span>Habitat</span><input id="fHabitat" name="habitat" placeholder="e.g. alpine meadow, rocky slope, Abies forest edge" /></label>
        </fieldset>

        <fieldset class="card">
          <legend>Observation</legend>
          <span class="field-label">Phenology</span>
          <div class="chips" id="phenoChips"></div>
          <label class="field"><span>Abundance</span>
            <select id="fAbundance" name="abundance">
              <option value="">not recorded</option>
              <option>Single individual</option><option>Rare</option><option>Occasional</option>
              <option>Frequent</option><option>Abundant</option><option>Dominant</option>
            </select>
          </label>
          <label class="field"><span>Notes</span>
            <textarea id="fNotes" name="notes" rows="4" placeholder="Height, flower colour, associated species, soil, slope, aspect…"></textarea>
          </label>
          <label class="field"><span>Tags</span><input id="fTags" name="tags" placeholder="medicinal, alpine, new record" /></label>
        </fieldset>

        <details class="card" id="voucherBox">
          <summary>Herbarium voucher</summary>
          <div class="grid-2">
            <label class="field"><span>Collector</span><input id="fCollector" name="collector" /></label>
            <label class="field"><span>Collection no.</span><input id="fCollNo" name="collectionNumber" /></label>
            <label class="field"><span>Herbarium</span><input id="fHerbarium" name="herbarium" placeholder="e.g. ARUN, ASSAM" /></label>
          </div>
        </details>

        <details class="card" id="ethnoBox">
          <summary>Ethnobotany</summary>
          <div class="grid-2">
            <label class="field"><span>Use</span><input id="eUse" /></label>
            <label class="field"><span>Part used</span><input id="ePart" placeholder="root, leaf, rhizome…" /></label>
            <label class="field"><span>Preparation</span><input id="ePrep" /></label>
            <label class="field"><span>Community</span><input id="eCommunity" placeholder="Monpa, Brokpa…" /></label>
            <label class="field"><span>Informant</span><input id="eInformant" /></label>
            <label class="field"><span>Informant age</span><input id="eAge" type="number" min="0" /></label>
            <label class="field"><span>Informant gender</span>
              <select id="eGender"><option value="">—</option><option>Female</option><option>Male</option><option>Other</option><option>Prefer not to say</option></select>
            </label>
            <label class="field"><span>Prior informed consent</span>
              <select id="eConsent"><option value="">—</option><option>Yes</option><option>No</option></select>
            </label>
          </div>
        </details>

        <div class="form-foot">
          <button type="button" id="deleteBtn" class="btn btn-danger hidden">Delete</button>
          <span class="spacer"></span>
          <button type="submit" class="btn btn-outline" data-save="draft">Save as draft</button>
          <button type="submit" class="btn btn-primary" data-save="auto">Save</button>
        </div>
      </div>
    </form>
  </section>

  <dialog id="confirmDialog" class="confirm">
    <form method="dialog">
      <p id="confirmText"></p>
      <div class="row-actions end">
        <button value="no" class="btn btn-ghost">Cancel</button>
        <button value="yes" class="btn btn-danger" id="confirmYes">Delete</button>
      </div>
    </form>
  </dialog>

  <div id="viewer" class="viewer hidden" role="dialog" aria-label="Photo"><img alt="" /></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet-heat.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
